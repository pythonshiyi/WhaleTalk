[project]
name = "whaletalk"
description = "鲸语 WhaleTalk · Windows 本地优先的 AI 桌面智能体"
# 版本号的单一事实源是 config_defaults.VERSION（不在此重复声明，避免两处漂移）。
# 本表只声明 Python 版本下限，用于让 pip 在过低解释器上明确拒绝安装。
# 与 [tool.ruff] target-version / [tool.mypy] python_version 三者必须保持一致；
# README 的「Python 3.11+」要求由本字段兜底。3.9/3.10 已 EOL，不再作为运行时下限。
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 禁用 pytest-asyncio 插件：它与部分 pytest 版本组合会在收集阶段抛
# INTERNALERROR（AttributeError: 'Package' object has no attribute 'obj'），
# 而本项目测试全部为同步用例。插件不存在时该选项为空操作，安全。
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "build",
    "dist",
    ".venv",
    "data",
    "evolutions",
    "__pycache__",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# 定位：ruff 在这里只守「正确性」（未定义 / 重复定义 / 闭包绑定 / 异常链 / 未使用变量等），
# 不拿它做风格打分。项目另有自建门禁（check_silent_except / check_docs / validate_tools …）
# 守静默异常、文档数字与工具清单等契约。
# - UP：Python 3.11 类型注解与字符串现代化（List→list、%→f-string 等），全量改要动
#   1000+ 处、横跨 70+ 文件，收益低而回归风险高，明确不强制。
# - SIM：控制流化简、contextlib.suppress、with open；绝大多数落在测试与短生命周期
#   读取上，CPython 引用计数随即释放，逐处改写 200+ 行不带来实际收益。
# - I001 / E702 / E731 / B905 / B011：导入顺序在多个模块是运行时契约（见下方
#   per-file-ignores）、历史同行多语句、lambda 赋值、zip(strict=)、测试里的 assert False。
# 真缺陷不靠这些开关绕过：F811 重复测试定义、B023 循环变量闭包、B904 异常链、
# B007/F841 未用变量、E741 易混淆变量名，均已在源码中修掉。
ignore = ["E501", "UP", "SIM", "I001", "E702", "E731", "B905", "B011"]

[tool.ruff.lint.per-file-ignores]
# 工具域聚合用 `from .tool_* import *` 做 re-export，F401/F403/F405 是设计使然（`__all__` 才是契约）。
# 导入顺序本身是契约（tool_mv 依赖 tool_desktop 先加载），故 __init__ 不做 isort 重排。
"agent_tools/__init__.py" = ["F401", "F403", "F405", "I001"]
# `from agent_tools import *` 必须位于共享基建全部定义之后、六层构建之前——顺序是契约，
# 禁止 isort 重排；它同时是对外（域模块/插件/测试）的历史 re-export 面，未用导入不清理。
# E402：共享常量 / `from agent_tools import *` 位于共享基建之后，顺序是契约。
# F405：star import 提供的工具函数（如 image_understand）在本模块内被调用。
"deepseek_client.py" = ["I001", "F401", "E402", "F405"]
# search_web 用 globals().get("_search_"+name) 动态派发引擎，导入看似未用实为运行必需；
# _browser_* 亦为对齐 deepseek_client 的实现面。禁用 F401 防止误删。
"agent_tools/tool_web.py" = ["F401"]
# E402：依赖清单表放在模块顶部，导入紧随其后（单一来源可读性优先）。
"deps.py" = ["E402"]
# E402：测试/门禁脚本需先 sys.path.insert 再 import 被测模块，顺序使然。
"tests/*" = ["E402"]
"tools/*" = ["E402"]
"agent_tools/tool_files.py" = ["E402"]
# 接入适配器必须先 sys.path.insert(_BASE) 再 import 根目录的 brain_* 模块，顺序是契约。
"brain_grant_adapter.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true